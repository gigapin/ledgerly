; Configurazione di Xdebug 3.
; Questo file viene montato da compose.yaml in
; /usr/local/etc/php/conf.d/zz-xdebug.ini dentro il container php-fpm.
;
; NOTA: qui NON va "zend_extension=xdebug.so".
; L'estensione e' gia' caricata da docker-php-ext-enable (vedi Dockerfile),
; che genera il suo docker-php-ext-xdebug.ini. Ripeterla qui darebbe
; il warning "Xdebug is already loaded".

; Cosa deve fare Xdebug. Il default di Xdebug 3 e' "develop" (solo var_dump
; migliorato e stack trace), che NON include il debugger passo-passo.
; Le modalita' si cumulano separandole con la virgola: es. "debug,coverage".
; Override al volo senza toccare questo file: la variabile d'ambiente
; XDEBUG_MODE ha la precedenza su questa riga. Per il coverage dei test:
;   docker compose exec -e XDEBUG_MODE=coverage php-fpm vendor/bin/pest --coverage
xdebug.mode = debug,develop

; Quando aprire una sessione di debug.
; "yes"     = a ogni richiesta HTTP e a ogni comando CLI. Comodo ma costoso:
;             se l'IDE non e' in ascolto ogni richiesta paga un timeout di
;             connessione, composer/phpstan/pest inclusi.
; "trigger" = solo se la richiesta porta un trigger esplicito. Vedi sotto.
xdebug.start_with_request = trigger

; Con "trigger", Xdebug parte se trova XDEBUG_TRIGGER in GET/POST/cookie
; (browser) o come variabile d'ambiente (CLI). Lasciando trigger_value vuoto
; va bene qualsiasi valore.
;   Browser: http://localhost:8888/?XDEBUG_TRIGGER=1
;   CLI:     docker compose exec -e XDEBUG_TRIGGER=1 php-fpm php script.php
xdebug.trigger_value =

; Dove sta in ascolto l'IDE. Il codice gira nel container, l'IDE sul Mac:
; host.docker.internal e' il nome con cui il container raggiunge l'host.
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003

; Non provare a indovinare l'IP del client dagli header HTTP: con un reverse
; proxy davanti (nginx) l'ipotesi sarebbe sbagliata. Ci fidiamo di client_host.
xdebug.discover_client_host = 0

; Identificativo della sessione. Serve solo se piu' IDE ascoltano la stessa
; porta e vogliono filtrare: l'estensione PHP Debug di VS Code NON filtra per
; idekey a meno che tu non imposti "ideKey" in launch.json. Nota che avviando
; con XDEBUG_TRIGGER=<valore>, e' <valore> a finire nell'idekey della sessione.
xdebug.idekey = VSCODE

; Log della connessione: e' l'unico modo per capire PERCHE' l'IDE non aggancia.
; Vive dentro il container e sparisce a ogni rebuild. A setup funzionante
; si puo' alzare log_level a 0 (solo errori) o togliere le due righe.
;   docker compose exec php-fpm cat /tmp/xdebug.log
xdebug.log = /tmp/xdebug.log
xdebug.log_level = 7


